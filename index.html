
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Emergency App - تطبيق الطوارئ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 390px;
      text-align: center;
      background: #1b2738;
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 12px 35px #0005;
    }
    h1 { margin-top: 0; }
    .subtitle { color: #bdc9d8; line-height: 1.8; }
    .emergency {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 7px solid #ff9a9a;
      background: #e3293b;
      color: white;
      font-size: 25px;
      font-weight: bold;
      margin: 25px auto;
      cursor: pointer;
    }
    .secondary {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #30445e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #message {
      margin-top: 20px;
      line-height: 1.8;
      color: #ffd5a3;
    }
    .note {
      font-size: 12px;
      color: #aebdce;
      line-height: 1.8;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🚨 تطبيق الطوارئ</h1>
    <p class="subtitle">واجهة تجريبية للمساعدة وقت الحاجة</p>

    <button class="emergency" onclick="testEmergency()">
      طلب<br>مساعدة
    </button>

    <button class="secondary" onclick="showLocation()">
      📍 اختبار الموقع
    </button>

    <button class="secondary" onclick="showContacts()">
      📞 جهات الاتصال
    </button>

    <p id="message">التطبيق جاهز للتجربة.</p>

    <p class="note">
      نسخة تجريبية فقط. الأزرار لا ترسل استغاثة حقيقية
      ولا تتصل بالطوارئ أو تشارك موقعك تلقائيًا.
    </p>
  </main>

  <script>
    function testEmergency() {
      document.getElementById("message").textContent =
        "هذا اختبار فقط. لم يتم إرسال أي استغاثة.";
    }

    function showLocation() {
      document.getElementById("message").textContent =
        "ميزة الموقع غير مفعّلة في هذه النسخة التجريبية.";
    }

    function showContacts() {
      document.getElementById("message").textContent =
        "لم تتم إضافة جهات اتصال للطوارئ بعد.";
    }
  </script>
</body>
</html>
